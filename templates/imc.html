<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/imc.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}">
</head>
<body>
    <header>
        <h1>Portal Saúde & Fitness</h1>
        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('profile') }}">Perfil</a>
            <a href="{{ url_for('about') }}">Sobre</a>
            <a href="{{ url_for('imc') }}">IMC</a>
            <a href="{{ url_for('greeting', nome='Convidado', idade=25, meta='Estar saudável') }}">Saudação</a>
            <a href="{{ url_for('fertile_period_page') }}">Período Fértil</a>
        </nav>
    </header>
    <main>
        <h1>Calculadora de IMC</h1>
        <div class="resultado">
            <div id="imc-form">
                <div>
                    <label for="peso">Peso (kg):</label>
                    <input type="number" step="0.1" id="peso" name="peso" value="{{ peso or '' }}">
                </div>
                <div>
                    <label for="altura">Altura (m):</label>
                    <input type="number" step="0.01" id="altura" name="altura" value="{{ altura or '' }}">
                </div>
                <button type="button" id="calculate-btn">Recalcular</button>
            </div>
            <hr>
            <div id="resultado-container" style="display: none;">
                <h2>Resultado</h2>
                <p>IMC: <span id="imc-value"></span></p>
                <p id="status-paragraph">Status: <span id="status-value"></span></p>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/imc.js') }}"></script>
</body>
</html>
