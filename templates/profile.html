<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Usuário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}">
</head>
<body>
    <header>
        <h1>Portal Saúde & Fitness</h1>
        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('profile') }}">Perfil</a>
            <a href="{{ url_for('about') }}">Sobre</a>
        </nav>
    </header>
    <main>
        <div class="profile-container">
            <div class="profile-header">
                <img src="{{ url_for('static', filename='images/image.png') }}" alt="Foto do Perfil" class="profile-picture">
                <h2 id="user-name"></h2>
            </div>
            <div class="profile-body">
                <p><strong>Email:</strong> <span id="user-email"></span></p>
                <p><strong>Telefone:</strong> <span id="user-phone"></span></p>
                <p><strong>Data de Nascimento:</strong> <span id="user-birthdate"></span></p>
                <p><strong>Cidade:</strong> <span id="user-city"></span></p>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/profile.js') }}"></script>
</body>
</html>
