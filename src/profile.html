<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Usuário</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/profile.css">
    <link rel="icon" href="/static/icons/favicon.ico">
</head>
<body>
    <header>
        <h1>Portal Saúde & Fitness</h1>
        <nav>
            <a href="/">Início</a>
            <a href="/login">Login</a>
            <a href="/profile">Perfil</a>
            <a href="/about">Sobre</a>
        </nav>
    </header>
    <main>
        <div class="profile-container">
            <div class="profile-header">
                <img src="/static/images/image.png" alt="Foto do Perfil" class="profile-picture">
                <h2 id="user-name"></h2>
            </div>
            <div class="profile-body">
                <p><strong>Email:</strong> <span id="user-email"></span></p>
                <p><strong>Telefone:</strong> <span id="user-phone"></span></p>
                <p><strong>Data de Nascimento:</strong> <span id="user-birthdate"></span></p>
                <p><strong>Cidade:</strong> <span id="user-city"></span></p>
            </div>
        </div>
    </main>

    <script src="/static/js/profile.js"></script>
</body>
</html>
