<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Usuário</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/profile.css">
    <link rel="icon" href="/static/icons/favicon.ico">
</head>
<body>
    <header>
        <h1>Portal Saúde & Fitness</h1>
        <nav>
            <a href="/">Início</a>
            <a href="/login">Login</a>
            <a href="/profile">Perfil</a>
            <a href="/about">Sobre</a>
        </nav>
    </header>
    <main>
        <div class="profile-container">
            <h2>Perfil do Usuário</h2>
            <p><strong>Nome:</strong> <span id="nome-usuario"></span></p>
            <p><strong>Senha:</strong> <span id="senha-usuario"></span></p>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const usuario = params.get('usuario');
            const senha = params.get('senha');

            if (usuario && senha) {
                document.getElementById('nome-usuario').innerText = usuario;
                document.getElementById('senha-usuario').innerText = senha;
            } else {
                document.getElementById('nome-usuario').innerText = 'N/A';
                document.getElementById('senha-usuario').innerText = 'N/A';
            }
        });
    </script>
</body>
</html>
